# ---------------------------------------------------------------------------------------------
# The calendar, served under /calendar/ on every host that serves the app.
#
# Why a path and not calendar.docurest.com in an iframe: a browser will not send the calendar's
# session cookie into a frame served from another site, so on a white-label host the framed
# calendar was signed out and empty. Under this path it is the same origin as the page around it.
#
# Included by docurest.com, calendar.docurest.com and every white-label portal — one file, so the
# three cannot drift apart.
# ---------------------------------------------------------------------------------------------

location /calendar/api/ {
    # The calendar API knows nothing about the prefix; strip it on the way in. The query string
    # survives a "break" rewrite untouched, which the SSO token depends on.
    rewrite ^/calendar(/api/.*)$ $1 break;

    proxy_pass http://docucalendar_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /calendar;
    proxy_read_timeout 120s;

    # No proxy_redirect here on purpose: the API builds its own browser-facing paths with the
    # prefix already in them, because its OAuth callback comes back through a different location
    # that could not rewrite anything.
}

location /calendar/ {
    alias /var/www/docucalendar/client/;
    index index.html;
    # Deep links (/calendar/schedule/<id>) must survive a refresh: fall back to the app's HTML,
    # by URI so the alias applies to it too.
    try_files $uri $uri/ /calendar/index.html;

    # Same origin as the page that frames it, so nothing wider is needed — and anything wider
    # would let another site put this calendar inside its own.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
}
