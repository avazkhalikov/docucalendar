# ---------------------------------------------------------------------------------------------
# Everything a white-label portal serves: the brand-neutral app shell, the API, the live
# connection, the widget, and the calendar under /calendar/.
#
# Generated portal blocks include this file, so a new customer domain needs no new nginx thinking
# — only a server_name and a certificate. Nothing here is host-specific: the brand comes from
# /api/portal/branding, which reads the white-label table, so one file serves every customer.
# ---------------------------------------------------------------------------------------------

# Matches every other block on this server: the deploy keeps this directory current.
root /var/www/ragstudio/client-green;

location /hubs/ {
    proxy_pass http://ragstudio_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

location /api/ {
    proxy_pass http://ragstudio_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 100M;
}

location /widget/ {
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        return 204;
    }
    proxy_pass http://ragstudio_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    expires 1d;
    add_header Cache-Control "public" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
}

location /lib/ {
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        return 204;
    }
    proxy_pass http://ragstudio_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    expires 7d;
    add_header Cache-Control "public" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
}

# The calendar, same origin as the app that frames it.
include /etc/nginx/snippets/docucalendar-path.conf;

# A portal is the app and nothing else: the marketing site belongs to us, not to the customer
# whose name is on this door.
location = / { return 302 /login; }
location = /index.html { return 302 /login; }
location ~ ^/(pricing|products|affiliate|ai-agents|use-cases|developers|tools|security|demo-tour|voice-demo|terms|privacy|refund-policy|download|downloads|try-it-live|wordpress-demo|setup-video|videos|lp|home-classic|home-v2|home3)(/|$) {
    return 302 /login;
}

location = /login         { try_files $uri /app.html; }
location = /register      { try_files $uri /app.html; }
location = /confirm-email { try_files $uri /app.html; }
location = /logout        { try_files $uri /app.html; }
location /app             { try_files $uri /app.html; }

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

location /.well-known/acme-challenge/ { root /var/www/html; }

location / { try_files $uri @login; }
location @login { return 302 /login; }
